          const handleDeletePhoneRow = (e, id) => { e.stopPropagation(); e.preventDefault(); const newSet = new Set(deletedPhoneIds); newSet.add(id); setDeletedPhoneIds(newSet); };
          const handleRestorePhoneRow = (e, id) => { e.stopPropagation(); e.preventDefault(); const newSet = new Set(deletedPhoneIds); newSet.delete(id); setDeletedPhoneIds(newSet); };
          const handleDeleteProfitSummaryRow = (e, name) => { e.stopPropagation(); e.preventDefault(); const newSet = new Set(deletedProfitSummaryNames); newSet.add(name); setDeletedProfitSummaryNames(newSet); };
          const handleRestoreProfitSummaryRow = (e, name) => { e.stopPropagation(); e.preventDefault(); const newSet = new Set(deletedProfitSummaryNames); newSet.delete(name); setDeletedProfitSummaryNames(newSet); };

          const getLastDeletedId = (set) => { const arr = Array.from(set); return arr.length > 0 ? arr[arr.length - 1] : null; };
          const handleUndoLastProfitDelete = (e) => { e.stopPropagation(); e.preventDefault(); const lastId = getLastDeletedId(deletedProfitIds); if (lastId) { const newSet = new Set(deletedProfitIds); newSet.delete(lastId); setDeletedProfitIds(newSet); } };
          const handleUndoLastPhoneDelete = (e) => { e.stopPropagation(); e.preventDefault(); const lastId = getLastDeletedId(deletedPhoneIds); if (lastId) { const newSet = new Set(deletedPhoneIds); newSet.delete(lastId); setDeletedPhoneIds(newSet); } };
          const handleUndoLastProfitSummaryDelete = (e) => { e.stopPropagation(); e.preventDefault(); const lastId = getLastDeletedId(deletedProfitSummaryNames); if (lastId) { const newSet = new Set(deletedProfitSummaryNames); newSet.delete(lastId); setDeletedProfitSummaryNames(newSet); } };

          const formatIDR = (value) => {
            if (value === undefined || value === null) return "Rp 0";
            return new Intl.NumberFormat('id-ID', {
              style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0,
            }).format(value);
          };

          const getBCStatus = (omset, nota) => {
            let scoreOmset = 0;
            if (omset > 12000000) scoreOmset = 2; else if (omset >= 6000000) scoreOmset = 1; else scoreOmset = 0;
            let scoreNota = 0;
            if (nota > 5) scoreNota = 2; else if (nota >= 3) scoreNota = 1; else scoreNota = 0;
            const finalScore = Math.max(scoreOmset, scoreNota);
            if (finalScore === 2) return { text: "BEBAS BC", className: "text-green-700 bg-green-100 border-green-200" };
            if (finalScore === 1) return { text: "BC 25", className: "text-yellow-700 bg-yellow-100 border-yellow-200" };
            return { text: "BC 50", className: "text-red-700 bg-red-100 border-red-200" };
          };

          const formatExcelDate = (serial) => {
            if (!serial) return "-";
            if (typeof serial === 'string') return serial;
            const utc_days  = Math.floor(serial - 25569);
            const utc_value = utc_days * 86400;                                      
            const date_info = new Date(utc_value * 1000);
            const day = date_info.getDate().toString().padStart(2, '0');
            const month = (date_info.getMonth() + 1).toString().padStart(2, '0');
            const year = date_info.getFullYear();
            return `${day}/${month}/${year}`;
          };

          // Helper State Insentif Dinamis
          const addIncentiveRule = () => {
              setIncentiveRules([...incentiveRules, { id: Date.now(), name: "", price: "", reward: "" }]);
              setIncentiveMode(false);
          };

          const removeIncentiveRule = (id) => {
              setIncentiveRules(incentiveRules.filter(r => r.id !== id));
              setIncentiveMode(false);
          };

          const updateIncentiveRule = (id, field, value) => {
              setIncentiveRules(incentiveRules.map(r => r.id === id ? { ...r, [field]: value } : r));
              setIncentiveMode(false);
          };

          const getIncentiveDetails = (item) => {
              const itemName = item.namaBarang ? String(item.namaBarang).toUpperCase() : "";
              const qty = Math.abs(item.qty || 0);
              const omset = Math.abs(item.omset || 0);
              const price = qty !== 0 ? Math.round(omset / qty) : 0;
              let isValidName = false, isValidPrice = false, unitIncentive = 0;
              
              if (incentiveMode && incentiveRules.length > 0) {
                  let matchedRules = [];
                  
                  // Cari semua rules yang cocok dengan nama barang
                  incentiveRules.forEach(rule => {
                      if (!rule.name) return;
                      const searchWords = rule.name.toUpperCase().split(',').map(w => w.trim()).filter(w => w);
                      const nameMatch = searchWords.some(word => itemName.includes(word));
                      if (nameMatch) {
                          matchedRules.push(rule);
                      }
                  });

                  if (matchedRules.length > 0) {
                      isValidName = true;
                      
                      // Urutkan rule dari harga syarat tertinggi ke terendah agar tidak terlewat insentif terbesar
                      matchedRules.sort((a, b) => {
                          const priceA = parseFloat(a.price) || 0;
                          const priceB = parseFloat(b.price) || 0;
                          return priceB - priceA;
                      });

                      // Cek mulai dari harga syarat tertinggi yang cocok
                      for (const rule of matchedRules) {
                          const targetPrice = parseFloat(rule.price);
                          if (!rule.price || isNaN(targetPrice)) {
                              isValidPrice = true;
                              unitIncentive = parseFloat(rule.reward) || 0;
                              break; // Break jika harga bebas
                          } else {
                              // Toleransi selisih harga Rp 1.500 atas/bawah. Jika harga jual di atas target (melebihi ketentuan), tidak akan dihitung.
                              if (price >= (targetPrice - 1500) && price <= (targetPrice + 1500)) {
                                  isValidPrice = true;
                                  unitIncentive = parseFloat(rule.reward) || 0;
                                  break; // Break saat harga sesuai dengan ketentuan
                              }
                          }
                      }
                  }
              }
              return { isValidName, isValidPrice, unitIncentive, price };
          };

          const renderKeterangan = (text) => text || "-";

          // --- HANDLER UPLOAD PENJUALAN UTAMA ---
          const processExcelFile = (file, isAppend = false) => {
            if (!file) return;
            if (!isLibLoaded) { setError("Pustaka Excel belum siap."); return; }
            
            if (!isAppend) {
                setSelectedSales(null); 
                setItemSearchTerm(""); 
                setViewMode('nota'); 
                setExpandedPhoneGroups({}); 
                setShowAllPhoneDetails(false); 
                setIncentiveMode(false);
            }
            
            setIsLoading(true); 
            setError(""); 
            
            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const bstr = evt.target.result;
                const XLSX = window.XLSX;
                const workbook = XLSX.read(bstr, { type: 'binary' });
                const wsname = workbook.SheetNames[0];
                const ws = workbook.Sheets[wsname];
                const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                
                let headerRowIndex = -1;
                let colIndices = {};
                const salesKeywords = ['nama penjual', 'sales', 'salesman'];
                const amountKeywords = ['jumlah', 'total', 'subtotal', 'omset'];
                
                for (let i = 0; i < rawData.length; i++) {
                  const row = rawData[i];
                  if (!row || row.length === 0) continue;
                  let hasSales = -1;
                  let hasAmount = -1;
                  row.forEach((cell, idx) => {
                      if (typeof cell !== 'string') return;
                      const val = cell.toLowerCase().trim();
                      if (hasSales === -1 && salesKeywords.some(k => val.includes(k))) hasSales = idx;
                      if (hasAmount === -1 && amountKeywords.some(k => val === k)) hasAmount = idx; 
                  });
                  if (hasAmount === -1) {
                      row.forEach((cell, idx) => {
                        if (typeof cell !== 'string') return;
                        const val = cell.toLowerCase().trim();
                        if (amountKeywords.some(k => val.includes(k))) hasAmount = idx;
                      });
                  }
                  if (hasSales !== -1 && hasAmount !== -1) {
                    headerRowIndex = i;
                    row.forEach((cell, idx) => {
                         if (typeof cell !== 'string') return;
                         const val = cell.toLowerCase().trim();
                         colIndices[val] = idx;
                         if (salesKeywords.some(k => val.includes(k))) colIndices['namaPenjual'] = idx;
                         if (amountKeywords.some(k => val === k)) colIndices['jumlah'] = idx;
                         if (val.includes('faktur') || val.includes('bukti')) colIndices['noFaktur'] = idx;
                         if (val.includes('kuantitas') || val.includes('qty') || val === 'pcs' || val.includes('jml') || (val.includes('jumlah') && (val.includes('barang') || val.includes('item')))) colIndices['qty'] = idx;
                         if (val.includes('keterangan')) colIndices['keterangan'] = idx;
                         if (val.includes('tanggal')) colIndices['tanggal'] = idx;
                         if (val.includes('pelanggan')) colIndices['pelanggan'] = idx;
                         if (val.includes('nama barang') || val.includes('deskripsi')) colIndices['barang'] = idx;
                         if (val === 'brand' || val === 'merk') colIndices['brand'] = idx;
                    });
                    break; 
                  }
                }
                if (headerRowIndex === -1) throw new Error("Format Excel tidak sesuai.");
                
                const dataRows = rawData.slice(headerRowIndex + 1);

                // -- MAPPING RAW DATA UNTUK LOGIKA DISKON --
                const tempRawMappedData = dataRows.map((row, index) => {
                    let rawJumlah = colIndices['jumlah'] !== undefined ? row[colIndices['jumlah']] : 0;
                    let cleanJumlah = typeof rawJumlah === 'string' ? parseFloat(rawJumlah.replace(/\./g, '').replace(/,/g, '.')) || 0 : (typeof rawJumlah === 'number' ? rawJumlah : 0);
                    
                    let rawQty = colIndices['qty'] !== undefined ? row[colIndices['qty']] : 0;
                    let cleanQty = typeof rawQty === 'string' ? parseFloat(rawQty.replace(/\./g, '').replace(/,/g, '.')) || 0 : (typeof rawQty === 'number' ? rawQty : 0);

                    const rawTanggal = row[colIndices['tanggal']] || null;
                    const dateObj = parseIndoDate(rawTanggal);

                    return {
                        index,
                        noFaktur: String(row[colIndices['noFaktur']] || "").trim().toUpperCase(),
                        tanggal: rawTanggal,
                        tanggalISO: formatDateToISO(dateObj),
                        namaBarang: String(row[colIndices['barang']] || "").trim(),
                        qty: cleanQty,
                        omset: cleanJumlah,
                        keterangan: String(row[colIndices['keterangan']] || "").trim(),
                        namaPenjual: String(row[colIndices['namaPenjual']] || "").trim(),
                        namaPelanggan: String(row[colIndices['pelanggan']] || "").trim()
                    };
                });
                setAllRawMappedData(tempRawMappedData);

                // -- LANJUTAN LOGIKA LAMA UNTUK DATA UTAMA --
                const consolidatedData = [];
                const validInvoiceCodes = ['GSIR', 'GSIG', 'GTPA', 'PTPA', 'GSR', 'GRG', 'PSIR'];
                const salesInvoiceCodes = ['GSIR', 'GSIG', 'GTPA', 'PTPA', 'PSIR'];
                dataRows.forEach((row) => {
                    const rawNama = colIndices['namaPenjual'] !== undefined ? row[colIndices['namaPenjual']] : "";
                    const rawFaktur = colIndices['noFaktur'] !== undefined ? String(row[colIndices['noFaktur']]).toUpperCase() : "";
                    const rawKeterangan = colIndices['keterangan'] !== undefined ? row[colIndices['keterangan']] : "";
                    const hasValidFaktur = validInvoiceCodes.some(code => rawFaktur.includes(code));
                    const hasName = rawNama && String(rawNama).trim() !== "";
                    const isNewTransaction = hasValidFaktur || (hasName && rawFaktur.length > 3); 
                    if (isNewTransaction) { consolidatedData.push(row); } 
                    else {
                        if (rawKeterangan && consolidatedData.length > 0) {
                            let targetIndex = -1;
                            for (let i = consolidatedData.length - 1; i >= 0; i--) {
                                const prevRow = consolidatedData[i];
                                const prevFaktur = colIndices['noFaktur'] !== undefined ? String(prevRow[colIndices['noFaktur']]).toUpperCase() : "";
                                if (salesInvoiceCodes.some(code => prevFaktur.includes(code))) { targetIndex = i; break; }
                            }
                            const finalTargetIndex = targetIndex !== -1 ? targetIndex : consolidatedData.length - 1;
                            const targetRow = consolidatedData[finalTargetIndex];
                            const ketIdx = colIndices['keterangan'];
                            if (ketIdx !== undefined) {
                                const existingKet = targetRow[ketIdx] ? String(targetRow[ketIdx]) : "";
                                targetRow[ketIdx] = (existingKet + " " + String(rawKeterangan)).trim();
                            }
                        }
                    }
                });

                const tempProcessedData = consolidatedData.map((row, index) => {
                  let rawJumlah = colIndices['jumlah'] !== undefined ? row[colIndices['jumlah']] : 0;
                  let cleanJumlah = 0;
                  if (typeof rawJumlah === 'string') { cleanJumlah = Math.abs(parseFloat(rawJumlah.replace(/\./g, '').replace(/,/g, '.')) || 0); } 
                  else if (typeof rawJumlah === 'number') { cleanJumlah = Math.abs(rawJumlah); }
                  let rawQty = colIndices['qty'] !== undefined ? row[colIndices['qty']] : 0; 
                  let cleanQty = 0;
                  if (typeof rawQty === 'string') { cleanQty = Math.abs(parseFloat(rawQty.replace(/\./g, '').replace(/,/g, '.')) || 0); } 
                  else if (typeof rawQty === 'number') { cleanQty = Math.abs(rawQty); }
                  const noFaktur = colIndices['noFaktur'] !== undefined ? String(row[colIndices['noFaktur']]).trim().toUpperCase() : "";
                  const keteranganRaw = colIndices['keterangan'] !== undefined ? String(row[colIndices['keterangan']]).trim().toUpperCase() : "";
                  let finalNamaPenjual = colIndices['namaPenjual'] !== undefined ? String(row[colIndices['namaPenjual']]).trim().toUpperCase() : "TANPA NAMA";
                  if (keteranganRaw) {
                    const upRegex = /(?:^|[\s\.,])UP[\s:\.,]+(.+)/i;
                    const match = keteranganRaw.match(upRegex);
                    if (match && match[1]) {
                       let afterUp = match[1].trim();
                       const words = afterUp.split(/\s+/);
                       if (words.length > 0) {
                           let takenWords = words.slice(0, 2).map(w => w.replace(/[.,;:]+$/, ""));
                           const newName = takenWords.join(" ").trim();
                           if (newName.length > 0) { finalNamaPenjual = newName; }
                       }
                    }
                  }
                  const tanggal = colIndices['tanggal'] !== undefined ? row[colIndices['tanggal']] : null;
                  const dateObj = parseIndoDate(tanggal);
                  const pelanggan = colIndices['pelanggan'] !== undefined ? row[colIndices['pelanggan']] : "-";
                  const barang = colIndices['barang'] !== undefined ? String(row[colIndices['barang']]).trim() : "-";
                  const brand = colIndices['brand'] !== undefined ? String(row[colIndices['brand']]).trim().toUpperCase() : "-";
                  
                  const uniqueId = `${noFaktur}-${barang}-${index}-${Math.random().toString(36).substr(2, 5)}`;

                  return { _id: uniqueId, namaPenjual: finalNamaPenjual, omset: cleanJumlah, noFaktur: noFaktur, qty: cleanQty, keterangan: keteranganRaw, tanggal: tanggal, tanggalISO: formatDateToISO(dateObj), namaPelanggan: pelanggan, namaBarang: barang, brand: brand };
                });

                const invoiceOwnerMap = {};
                tempProcessedData.forEach(item => {
                    if (item.noFaktur.includes('GSIR') || item.noFaktur.includes('GSIG') || item.noFaktur.includes('GTPA') || item.noFaktur.includes('PTPA') || item.noFaktur.includes('PSIR')) { invoiceOwnerMap[item.noFaktur] = item.namaPenjual; }
                });

                const finalData = tempProcessedData.map(item => {
                    const isReturn = item.noFaktur.includes('GSR') || item.noFaktur.includes('GRG');
                    if (isReturn && item.keterangan) {
                        const refInvoiceRegex = /(GSIR|GSIG|GTPA|PTPA|PSIR)[\w\.-]+/i;
                        const match = item.keterangan.match(refInvoiceRegex);
                        if (match && match[0]) {
                            const originalInvoiceNo = match[0].toUpperCase();
                            if (invoiceOwnerMap[originalInvoiceNo]) { return { ...item, namaPenjual: invoiceOwnerMap[originalInvoiceNo] }; }
                        }
                    }
                    return item;
                }).filter(item => item.namaPenjual !== "TANPA NAMA");

                if (isAppend) {
                    setAllRawMappedData(prev => [...prev, ...tempRawMappedData]);
                    setAllData(prev => [...prev, ...finalData]);
                    setUploadedFiles(prev => [...prev, { name: file.name, rows: finalData.length }]);
                    setAppendSuccessData({
                        show: true,
                        message: 'Data Berhasil Ditambahkan!',
                        detail: `${finalData.length} transaksi (dari ${dataRows.length} baris Excel) telah digabungkan.`
                    });
                    setTimeout(() => setAppendSuccessData({ show: false, message: '', detail: '' }), 6000);
                } else {
                    setAllRawMappedData(tempRawMappedData);
                    setAllData(finalData);
                    setUploadedFiles([{ name: file.name, rows: finalData.length }]);
                }
                
                setIsLoading(false);
              } catch (err) { console.error(err); setError(err.message || "Gagal memproses file."); setIsLoading(false); }
            };
            reader.readAsBinaryString(file);
          };

          const handlePriceListUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setPriceListFileName(file.name);
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const bstr = evt.target.result;
                    const XLSX = window.XLSX;
                    const workbook = XLSX.read(bstr, { type: 'binary' });
                    
                    // --- 1. PARSE PRICELIST UTAMA ---
                    let wsPricelistName = workbook.SheetNames.find(n => n.toUpperCase().includes('PRICE'));
                    if (!wsPricelistName) wsPricelistName = workbook.SheetNames[0]; // fallback ke sheet pertama
                    const ws = workbook.Sheets[wsPricelistName];
                    const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    let headerRowIndex = -1;
                    let nameColIdx = -1;
                    let costColIdx = -1;

                    const nameKeywords = ['desk. barang', 'nama barang', 'barang', 'item', 'description', 'produk'];
                    const costKeywords = ['harga habis', 'harga modal', 'modal', 'hpp', 'cost', 'harga beli'];

                    for (let i = 0; i < rawData.length; i++) {
                        const row = rawData[i];
                        if(!row || row.length === 0) continue;
                        
                        let tempNameIdx = -1;
                        let tempCostIdx = -1;

                        row.forEach((cell, idx) => {
                            if (typeof cell !== 'string') return;
                            const val = cell.toLowerCase().trim();
                            if (tempNameIdx === -1 && nameKeywords.some(k => val.includes(k))) tempNameIdx = idx;
                            if (tempCostIdx === -1 && costKeywords.some(k => val.includes(k))) tempCostIdx = idx;
                        });
                        if (tempNameIdx !== -1 && tempCostIdx !== -1) {
                            headerRowIndex = i;
                            nameColIdx = tempNameIdx;
                            costColIdx = tempCostIdx;
                            break;
                        }
                    }
                    if (headerRowIndex === -1) { alert("Format Daftar Harga tidak dikenali. Pastikan ada kolom 'Nama Barang' dan 'Harga Modal/HPP'."); return; }
                    
                    const priceMap = {};
                    for (let i = headerRowIndex + 1; i < rawData.length; i++) {
                        const row = rawData[i];
                        if (!row) continue;
                        
                        const name = row[nameColIdx];
                        let cost = row[costColIdx];
                        let cb = row[5]; 

                        if (name && cost !== undefined) {
                            const cleanName = String(name).trim().toUpperCase();
                            if (typeof cost === 'string') { cost = parseFloat(cost.replace(/\./g, '').replace(/,/g, '.')); }
                            if (typeof cb === 'string') { cb = parseFloat(cb.replace(/\./g, '').replace(/,/g, '.')); }
                            
                            if (!isNaN(cost)) { 
                                priceMap[cleanName] = { 
                                    cost: cost, 
                                    cb: (!isNaN(cb) && cb > 0) ? cb : 0 
                                }; 
                            }
                        }
                    }
                    setPriceListData(priceMap);

                    // MENGAMBIL SHEET KEDUA (INDEX 1) UNTUK PROMO WEEKLY & BDOT SESUAI REQUEST
                    // Fallback: Jika karena suatu hal sheet kedua kosong/tidak ada, cari yang mengandung nama 'WEEKLY', 'PROMO', atau 'BDOT'
                    let promoSheetName = workbook.SheetNames.length > 1 ? workbook.SheetNames[1] : null;
                    if (!promoSheetName) {
                        promoSheetName = workbook.SheetNames.find(n => n.toUpperCase().includes('WEEKLY') || n.toUpperCase().includes('PROMO') || n.toUpperCase().includes('BDOT'));
                    }

                    let weeklyMap = {};
                    if (promoSheetName) {
                        const wsPromo = workbook.Sheets[promoSheetName];
                        const rawPromo = XLSX.utils.sheet_to_json(wsPromo, { header: 1 });
                        
                        let tableHeaders = []; // Menyimpan pasangan index kolom [model, cashback, toko] untuk setiap tabel
                        let promoHeaderRow = -1;

                        // Cari baris header (maksimal cek 15 baris pertama)
                        for (let i = 0; i < Math.min(rawPromo.length, 15); i++) {
                            const row = rawPromo[i];
                            if (!row) continue;
                            
                            let mCols = [], cCols = [], tCols = [];
                            row.forEach((cell, idx) => {
                                if (typeof cell !== 'string') return;
                                const val = cell.toLowerCase().trim();
                                const valNoSpace = val.replace(/\s/g, ''); // Menghilangkan spasi untuk antisipasi typo seperti 'CASHBAC K'
                                
                                if (val === 'model' || val === 'tipe' || val === 'type') mCols.push(idx);
                                if (valNoSpace.includes('cashback') || valNoSpace.includes('addcb')) cCols.push(idx);
                                if (val === 'toko' || val === 'cabang') tCols.push(idx);
                            });

                            // Jika ditemukan minimal 1 kolom model dan 1 kolom cashback, ini adalah baris header
                            if (mCols.length > 0 && cCols.length > 0) {
                                promoHeaderRow = i;
                                // Pasangkan kolom Model dengan kolom Cashback terdekat di sebelah kanannya
                                mCols.forEach(mIdx => {
                                    // Cari cashback column terdekat ke kanan (maksimal jarak 8 kolom)
                                    const cbIdx = cCols.find(c => c > mIdx && c - mIdx <= 8);
                                    // Cari toko column terdekat ke kiri (maksimal jarak 6 kolom)
                                    const tokoIdx = tCols.slice().reverse().find(t => t < mIdx && mIdx - t <= 6);
                                    
                                    if (cbIdx !== undefined) {
                                        tableHeaders.push({ 
                                            modelIdx: mIdx, 
                                            cbIdx: cbIdx, 
                                            tokoIdx: tokoIdx !== undefined ? tokoIdx : -1 
                                        });
                                    }
                                });
                                break;
                            }
                        }

                        // Ekstrak data berdasarkan index kolom yang sudah dipasangkan (Support Multi-Tabel bersebelahan)
                        if (promoHeaderRow !== -1 && tableHeaders.length > 0) {
                            for (let i = promoHeaderRow + 1; i < rawPromo.length; i++) {
                                const row = rawPromo[i];
                                if (!row) continue;
                                
                                tableHeaders.forEach(({ modelIdx, cbIdx, tokoIdx }) => {
                                    const model = row[modelIdx];
                                    let cb = row[cbIdx];
                                    let toko = tokoIdx !== -1 ? row[tokoIdx] : "SEMUA";
                                    
                                    if (model && cb !== undefined && cb !== null && cb !== '-' && cb !== '') {
                                        const cleanModel = String(model).trim().toUpperCase();
                                        let cleanCb = 0;
                                        if (typeof cb === 'string') {
                                            cleanCb = parseFloat(cb.replace(/\./g, '').replace(/,/g, '.'));
                                        } else if (typeof cb === 'number') {
                                            cleanCb = cb;
                                        }
                                        if (!isNaN(cleanCb) && cleanCb > 0) {
                                            weeklyMap[cleanModel] = { cb: cleanCb, toko: String(toko).trim().toUpperCase() };
                                        }
                                    }
                                });
                            }
                        }
                    }
                    setPromoWeeklyData(weeklyMap);

                } catch (err) { console.error(err); alert("Gagal membaca file daftar harga."); }
            };
            reader.readAsBinaryString(file);
          };

          const handlePromoUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setPromoFileName(file.name);
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const bstr = evt.target.result;
                    const XLSX = window.XLSX;
                    const workbook = XLSX.read(bstr, { type: 'binary' });
                    const wsname = workbook.SheetNames[0];
                    const ws = workbook.Sheets[wsname];
                    const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    let headerRowIndex = -1;
                    let nameColIdx = -1;
                    let promoPriceColIdx = -1;
                    let freeColIdx = -1;

                    const nameKeywords = ['nama barang', 'barang', 'item', 'produk'];
                    const priceKeywords = ['harga promo', 'promo', 'special price'];
                    const freeKeywords = ['free', 'bonus', 'gratis', 'hadiah'];

                    for (let i = 0; i < rawData.length; i++) {
                        const row = rawData[i];
                        if(!row || row.length === 0) continue;
                        
                        let tempNameIdx = -1;
                        let tempPriceIdx = -1;
                        let tempFreeIdx = -1;

                        row.forEach((cell, idx) => {
                            if (typeof cell !== 'string') return;
                            const val = cell.toLowerCase().trim();
                            if (tempNameIdx === -1 && nameKeywords.some(k => val.includes(k))) tempNameIdx = idx;
                            if (tempPriceIdx === -1 && priceKeywords.some(k => val.includes(k))) tempPriceIdx = idx;
                            if (tempFreeIdx === -1 && freeKeywords.some(k => val.includes(k))) tempFreeIdx = idx;
                        });
                        if (tempNameIdx !== -1 && tempPriceIdx !== -1) {
                            headerRowIndex = i;
                            nameColIdx = tempNameIdx;
                            promoPriceColIdx = tempPriceIdx;
                            freeColIdx = tempFreeIdx;
                            break;
                        }
                    }
                    if (headerRowIndex === -1) { alert("Format Daftar Promo tidak dikenali. Pastikan ada kolom 'Nama Barang' dan 'Harga Promo'."); return; }
                    
                    const pMap = {};
                    for (let i = headerRowIndex + 1; i < rawData.length; i++) {
                        const row = rawData[i];
                        if (!row) continue;
                        
                        const name = row[nameColIdx];
                        let price = row[promoPriceColIdx];
                        let free = freeColIdx !== -1 ? row[freeColIdx] : "";

                        if (name && price !== undefined) {
                            const cleanName = String(name).trim().toUpperCase();
                            if (typeof price === 'string') { price = parseFloat(price.replace(/\./g, '').replace(/,/g, '.')); }
                            
                            if (!isNaN(price)) { 
                                pMap[cleanName] = { 
                                    price: price, 
                                    free: free || "" 
                                }; 
                            }
                        }
                    }
                    setPromoData(pMap);
                } catch (err) { console.error(err); alert("Gagal membaca file promo."); }
            };
            reader.readAsBinaryString(file);
          };

          // --- HANDLER UPLOAD AGING ---
          const handleAgingUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setAgingFileName(file.name);
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const bstr = evt.target.result;
                    const XLSX = window.XLSX;
                    const workbook = XLSX.read(bstr, { type: 'binary' });
                    const wsname = workbook.SheetNames[0];
                    const ws = workbook.Sheets[wsname];
                    const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    let headerRowIndex = -1;
                    let nameColIdx = -1;
                    let ageColIdx = -1;

                    const nameKeywords = ['nama barang', 'barang', 'item', 'produk', 'deskripsi'];
                    const ageKeywords = ['umur', 'hari', 'age', 'aging', 'lama', 'kategori'];

                    for (let i = 0; i < rawData.length; i++) {
                        const row = rawData[i];
                        if(!row || row.length === 0) continue;
                        
                        let tempNameIdx = -1;
                        let tempAgeIdx = -1;

                        row.forEach((cell, idx) => {
                            if (typeof cell !== 'string') return;
                            const val = cell.toLowerCase().trim();
                            if (tempNameIdx === -1 && nameKeywords.some(k => val === k || val.includes(k))) tempNameIdx = idx;
                            if (tempAgeIdx === -1 && ageKeywords.some(k => val.includes(k))) tempAgeIdx = idx;
                        });
                        if (tempNameIdx !== -1) {
                            headerRowIndex = i;
                            nameColIdx = tempNameIdx;
                            ageColIdx = tempAgeIdx; // Bisa -1 jika tidak ada kolom umur, tidak masalah
                            break;
                        }
                    }
                    if (headerRowIndex === -1) { alert("Format Daftar Aging tidak dikenali. Pastikan minimal ada kolom 'Nama Barang'."); return; }
                    
                    const aMap = {};
                    for (let i = headerRowIndex + 1; i < rawData.length; i++) {
                        const row = rawData[i];
                        if (!row) continue;
                        
                        const name = row[nameColIdx];
                        let age = ageColIdx !== -1 ? row[ageColIdx] : "Aging";

                        if (name) {
                            const cleanName = String(name).trim().toUpperCase();
                            aMap[cleanName] = { umur: age || "Aging" }; 
                        }
                    }
                    setAgingData(aMap);
                } catch (err) { console.error(err); alert("Gagal membaca file aging."); }
            };
            reader.readAsBinaryString(file);
          };

          // --- HANDLER PASTE AGING ---
          const processPastedAgingData = () => {
            if (!pastedAgingText || !pastedAgingText.trim()) return;
            
            // Split berdasarkan baris baru dengan support format Windows (\r\n) dan Mac/Linux (\n)
            // Filter juga baris yang benar-benar kosong
            const rawRows = pastedAgingText.split(/\r?\n/).filter(row => row.trim().length > 0);
            
            if (rawRows.length === 0) {
                alert("Data kosong.");
                return;
            }

            // Pisahkan isi kolom menggunakan Tab (\t) yang merupakan bawaan Copy Paste Excel
            const rows = rawRows.map(row => row.split('\t'));

            let headerRowIndex = -1;
            let nameColIdx = 0; // Default ke kolom pertama jika tidak ada header
            let ageColIdx = 1;  // Default ke kolom kedua jika tidak ada header

            // Kata kunci yang lebih luas untuk mendeteksi Header
            const nameKeywords = ['nama', 'barang', 'item', 'produk', 'deskripsi', 'model', 'type'];
            const ageKeywords = ['umur', 'hari', 'age', 'aging', 'lama', 'kategori', 'waktu'];

            // Cari baris header (maksimal cek 5 baris pertama untuk antisipasi blank space)
            for (let i = 0; i < Math.min(rows.length, 5); i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;
                
                let tempNameIdx = -1;
                let tempAgeIdx = -1;

                row.forEach((cell, idx) => {
                    const val = String(cell).toLowerCase().trim();
                    if (tempNameIdx === -1 && nameKeywords.some(k => val === k || val.includes(k))) tempNameIdx = idx;
                    if (tempAgeIdx === -1 && ageKeywords.some(k => val === k || val.includes(k))) tempAgeIdx = idx;
                });

                if (tempNameIdx !== -1) {
                    headerRowIndex = i;
                    nameColIdx = tempNameIdx;
                    ageColIdx = tempAgeIdx;
                    break;
                }
            }

            const aMap = {};
            let validCount = 0;

            // Jika ada header, mulai dari baris setelahnya. Jika tidak ada header, mulai dari baris paling awal (0).
            const startIndex = headerRowIndex !== -1 ? headerRowIndex + 1 : 0;

            for (let i = startIndex; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;
                
                const nameRaw = row[nameColIdx];
                if (!nameRaw) continue;

                const name = String(nameRaw).trim().toUpperCase();
                if (!name) continue; // Skip jika nama kosong
                
                let age = "Aging";
                // Cek apakah ada data di kolom umur (baik yang terdeteksi header, maupun asumsi kolom ke-2)
                if (ageColIdx !== -1 && row[ageColIdx]) {
                    age = String(row[ageColIdx]).trim();
                } else if (headerRowIndex === -1 && row.length > 1 && row[1]) {
                    // Fallback: Jika tanpa header, tapi user mem-paste 2 kolom, gunakan kolom kedua sbg keterangan
                    age = String(row[1]).trim();
                }
                
                aMap[name] = { umur: age };
                validCount++;
            }

            if (validCount > 0) {
                setAgingData(aMap);
                setShowPasteAging(false);
                setPastedAgingText("");
                setAgingFileName("Data Paste Excel");
                
                // Tampilkan notifikasi toast hijau di pojok kiri bawah
                setAppendSuccessData({
                    show: true,
                    message: 'Data Aging Berhasil Diproses!',
                    detail: `${validCount} jenis barang berhasil disinkronkan.`
                });
                setTimeout(() => setAppendSuccessData({ show: false, message: '', detail: '' }), 4000);
            } else {
                alert("Tidak ada baris data barang yang valid ditemukan.");
            }
          };

          // LOGIKA BARU: REKAP POTONGAN GABUNGAN
          const discountMatchData = useMemo(() => {
            if (!rawMappedData || rawMappedData.length === 0) return [];
            let initialResults = [];
            const groupedData = {};

            rawMappedData.forEach(row => {
                const inv = row.noFaktur;
                if (!inv) return;
                if (!groupedData[inv]) groupedData[inv] = [];
                groupedData[inv].push(row);
            });

            Object.keys(groupedData).forEach(invNo => {
                const rows = groupedData[invNo];
                rows.forEach((currentRow, idx) => {
                    if (isDiscountRow(currentRow)) {
                        let targetItem = null;
                        let matchMethod = "None";

                        let candidateAbove = null;
                        for (let i = idx - 1; i >= 0; i--) {
                            const prev = rows[i];
                            if (isValidItem(prev)) {
                                candidateAbove = prev;
                                break;
                            }
                        }

                        let candidateNameMatch = null;
                        const validCandidates = rows.filter(r => isValidItem(r));
                        let maxScore = 0;
                        validCandidates.forEach(item => {
                            const score = calculateMatchScore(item.namaBarang, currentRow.namaBarang);
                            if (score > 0 && score > maxScore) {
                                maxScore = score;
                                candidateNameMatch = item;
                            }
                        });

                        const aboveScore = candidateAbove ? calculateMatchScore(candidateAbove.namaBarang, currentRow.namaBarang) : 0;
                        const isAboveMatch = aboveScore > 0;

                        if (candidateAbove) {
                            if (isAboveMatch) {
                                targetItem = candidateAbove; matchMethod = "Atas (Cocok)";
                            } else {
                                if (candidateNameMatch) { targetItem = candidateNameMatch; matchMethod = "Nama Cocok (Ganti Atas)"; } 
                                else { targetItem = candidateAbove; matchMethod = "Atas (Tanpa Cocok)"; }
                            }
                        } else {
                            if (candidateNameMatch) { targetItem = candidateNameMatch; matchMethod = "Nama Cocok"; } 
                            else {
                                if (idx < rows.length - 1) {
                                    const next = rows[idx + 1];
                                    if (isValidItem(next)) { targetItem = next; matchMethod = "Bawah"; }
                                }
                                if (!targetItem) {
                                    let nearest = null; let minDist = Infinity;
                                    rows.forEach((r, rIdx) => {
                                        if (isValidItem(r)) { const dist = Math.abs(rIdx - idx); if (dist < minDist) { minDist = dist; nearest = r; } }
                                    });
                                    if (nearest) { targetItem = nearest; matchMethod = "Terdekat (Fallback)"; }
                                }
                            }
                        }

                        if (targetItem) {
                            const discountValue = currentRow.omset; // Sudah menyimpan minus dari handleFileUpload raw
                            const itemTotal = targetItem.omset;
                            const quantity = targetItem.qty;
                            const unitDiscount = quantity !== 0 ? discountValue / quantity : 0;

                            let noHp = "-";
                            const ketForHp = (targetItem.keterangan || "") + " " + (currentRow.keterangan || "");
                            const hpMatch = ketForHp.match(/(?:^|\D)((?:\d(?:[\s-]*\d){8,14}))(?:\D|$)/);
                            if (hpMatch && hpMatch[1]) {
                                noHp = hpMatch[1].replace(/[\s-]/g, '');
                            }

                            initialResults.push({
                                id: `${currentRow.noFaktur}-${idx}`,
                                noFaktur: currentRow.noFaktur,
                                tanggal: targetItem.tanggal,
                                namaPelanggan: targetItem.namaPelanggan,
                                namaPenjual: targetItem.namaPenjual,
                                namaBarang: targetItem.namaBarang,
                                namaPotongan: currentRow.namaBarang,
                                keterangan: currentRow.keterangan || "",
                                noHp: noHp,
                                kuantitas: quantity,
                                hargaSatuan: quantity !== 0 ? itemTotal / quantity : 0,
                                hargaPotonganSatuan: unitDiscount,
                                nilaiPotongan: discountValue,
                                itemTotal: itemTotal,
                                jumlahTotal: itemTotal + discountValue,
                                matchInfo: matchMethod,
                                isLinked: false,
                                linkType: null,
                                itemOriginalIndex: targetItem.index
                            });
                        }
                    }
                });
            });

            const aggregatedMap = {};
            initialResults.forEach(row => {
                const key = `${row.noFaktur}_${row.itemOriginalIndex}`;
                if (!aggregatedMap[key]) aggregatedMap[key] = [];
                aggregatedMap[key].push(row);
            });

            const aggregatedResults = [];
            Object.values(aggregatedMap).forEach(group => {
                if (group.length === 1) aggregatedResults.push(group[0]);
                else {
                    group.forEach(row => aggregatedResults.push({ ...row, isMultiDiscount: true, multiCount: group.length }));
                }
            });

            const rowsByInvoice = {};
            const childInvoiceSet = new Set();
            const parentToChildMap = {};

            aggregatedResults.forEach(row => {
                const inv = row.noFaktur;
                if (!rowsByInvoice[inv]) rowsByInvoice[inv] = [];
                rowsByInvoice[inv].push(row);
            });

            Object.keys(rowsByInvoice).forEach(invKey => {
                const invLower = invKey.toLowerCase();
                let searchTargets = [];
                if (invLower.includes('gsr')) searchTargets = ['gsir', 'gtpa', 'ptpa', 'psir'];
                else if (invLower.includes('grg')) searchTargets = ['gsig'];

                if (searchTargets.length > 0) {
                    const rows = rowsByInvoice[invKey];
                    const refString = rows.map(r => String(r.keterangan || "").toLowerCase()).find(k => searchTargets.some(target => k.includes(target)));
                    if (refString) {
                        const words = refString.split(/[\s,]+/);
                        const refRaw = words.find(w => searchTargets.some(target => w.includes(target)));
                        if (refRaw) {
                            const cleanRef = refRaw.replace(/[.,]$/, "");
                            const parentInvKey = Object.keys(rowsByInvoice).find(k => k.toLowerCase().includes(cleanRef.toLowerCase()));
                            if (parentInvKey && parentInvKey !== invKey) {
                                if (!parentToChildMap[parentInvKey]) parentToChildMap[parentInvKey] = new Set();
                                parentToChildMap[parentInvKey].add(invKey);
                                childInvoiceSet.add(invKey);
                                rowsByInvoice[parentInvKey].forEach(r => { r.isLinked = true; r.linkType = 'parent'; });
                                rowsByInvoice[invKey].forEach(r => { r.isLinked = true; r.linkType = 'child'; });
                            }
                        }
                    }
                }
            });

            const finalOrderedResults = [];
            const processedInvoices = new Set();
            aggregatedResults.forEach(row => {
                const currentInv = row.noFaktur;
                if (processedInvoices.has(currentInv)) return;
                if (childInvoiceSet.has(currentInv)) return;

                const currentRows = rowsByInvoice[currentInv];
                if (currentRows) {
                    finalOrderedResults.push(...currentRows);
                    processedInvoices.add(currentInv);
                }

                if (parentToChildMap[currentInv]) {
                    const childrenInvoices = Array.from(parentToChildMap[currentInv]);
                    childrenInvoices.forEach(childInv => {
                        const childRows = rowsByInvoice[childInv];
                        if (childRows) {
                            finalOrderedResults.push(...childRows);
                            processedInvoices.add(childInv);
                        }
                    });
                }
            });

            return finalOrderedResults;
          }, [rawMappedData]);

          const displayedDiscountData = useMemo(() => {
            if (!discountMatchData) return [];
            return discountMatchData.filter(row => {
                let matchItem = true;
                let fieldToSearch = '';
                switch (frontSearchCategory) {
                    case 'NO FAKTUR': fieldToSearch = row.noFaktur; break;
                    case 'NAMA PENJUAL': fieldToSearch = row.namaPenjual; break;
                    case 'NAMA PELANGGAN': fieldToSearch = row.namaPelanggan; break;
                    case 'KETERANGAN': fieldToSearch = row.keterangan; break;
                    case 'NAMA BARANG': fieldToSearch = row.namaBarang; break;
                    default: fieldToSearch = '';
                }
                
                const targetStr = String(fieldToSearch || '').toLowerCase();

                if (itemSearchTerm) {
                    matchItem = targetStr.includes(itemSearchTerm.toLowerCase());
                }
                
                if (matchItem && itemExcludeSearchTerm) {
                    const excludeTerms = itemExcludeSearchTerm.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
                    if (excludeTerms.length > 0 && excludeTerms.some(term => targetStr.includes(term))) {
                        matchItem = false;
                    }
                }
                
                const matchDiscount = discountSearch ? String(row.namaPotongan).toLowerCase().includes(discountSearch.toLowerCase()) : true;
                
                let matchType = true;
                const inv = String(row.noFaktur || "").toLowerCase();
                
                if (categoryMode === 'retail') matchType = inv.includes('gsir') || inv.includes('gsr') || inv.includes('gtpa') || inv.includes('ptpa') || inv.includes('psir');
                else if (categoryMode === 'grosir') matchType = inv.includes('gsig') || inv.includes('grg');

                let priceMatch = true;
                if (minPriceFilter || maxPriceFilter) {
                     const min = parseFloat(minPriceFilter) || 0;
                     const max = parseFloat(maxPriceFilter) || Infinity;
                     const unitPrice = Math.abs(row.hargaSatuan);
                     if (minPriceFilter && unitPrice < min) priceMatch = false;
                     if (maxPriceFilter && unitPrice > max) priceMatch = false;
                }

                return matchItem && matchDiscount && matchType && priceMatch;
            });
          }, [discountMatchData, itemSearchTerm, itemExcludeSearchTerm, discountSearch, categoryMode, minPriceFilter, maxPriceFilter, frontSearchCategory]);

          const discountStats = useMemo(() => {
            const totalAmount = displayedDiscountData.reduce((acc, curr) => acc + curr.jumlahTotal, 0);
            const totalDiskon = displayedDiscountData.reduce((acc, curr) => acc + curr.nilaiPotongan, 0);
            const uniqueInvoices = new Set(displayedDiscountData.map(r => r.noFaktur));

            return { totalFaktur: uniqueInvoices.size, countRows: displayedDiscountData.length, totalAmount, totalDiskonValue: totalDiskon };
          }, [displayedDiscountData]);


          // --- LOGIC: PROFIT ANALYSIS ---
          const profitData = useMemo(() => {
            if ((viewMode !== 'profit' && viewMode !== 'cashback') || !data || Object.keys(priceListData).length === 0) return [];
            
            // Key format: "INVOICE_NO|ITEM_NAME"
            const returnedItemsMap = new Set();
            data.forEach(item => {
                const isReturn = item.noFaktur.includes('GSR') || item.noFaktur.includes('GRG');
                if (isReturn && item.keterangan) {
                     const refMatch = item.keterangan.match(/(GSIR|GSIG|GTPA)[\w\.-]+/i);
                     if (refMatch) {
                         const refFaktur = refMatch[0].toUpperCase();
                         const refItem = item.namaBarang ? item.namaBarang.trim().toUpperCase() : "";
                         if (refItem) {
                             returnedItemsMap.add(`${refFaktur}|${refItem}`);
                         }
                     }
                }
            });

            const calculated = data.map(item => {
                const itemName = item.namaBarang ? String(item.namaBarang).trim().toUpperCase() : "";
                const priceItem = priceListData[itemName];
                let costPrice = priceItem ? priceItem.cost : 0;
                let cbRetail = priceItem ? priceItem.cb : 0;

                if (itemName.includes('PIPA AC DENPOO') || itemName.includes('PIPA DENPO')) { costPrice = costPrice / 30; }
                
                const isReturn = item.noFaktur.includes('GSR') || item.noFaktur.includes('GRG');
                const multiplier = isReturn ? -1 : 1;
                const absQty = Math.abs(item.qty || 0);
                const absOmset = Math.abs(item.omset || 0);
                let profit = 0, profitPercent = 0, found = false;
                
                const isTransfer = item.keterangan && (item.keterangan.toUpperCase().includes('TRANSFER') || item.keterangan.toUpperCase().includes(' UP ') || item.keterangan.toUpperCase().startsWith('UP'));
                const isPromo = item.keterangan && item.keterangan.toUpperCase().includes('PROMO');

                if (priceItem) {
                    found = true;
                    const totalCost = costPrice * absQty;
                    const totalSell = absOmset; 
                    const rawProfit = totalSell - totalCost;
                    profit = rawProfit * multiplier;
                    if (totalCost !== 0) { profitPercent = (rawProfit / totalCost) * 100; }
                }
                return { 
                    ...item, 
                    costPrice: costPrice, 
                    cbRetail: cbRetail, 
                    profit: profit, 
                    profitPercent: profitPercent, 
                    isFound: found, 
                    isTransfer: isTransfer,
                    isPromo: isPromo
                };
            });
            
            return calculated.filter(item => {
                     if (!item.isFound) return false;
                     const noFaktur = item.noFaktur;
                     if (noFaktur.includes('GSR')) return false;
                     
                     const currentItemName = item.namaBarang ? item.namaBarang.trim().toUpperCase() : "";
                     if (returnedItemsMap.has(`${noFaktur}|${currentItemName}`)) return false; 

                     const ket = item.keterangan ? item.keterangan.toUpperCase() : "";
                     if ((ket.includes(' UP ') || ket.startsWith('UP')) && !item.isTransfer) return false;

                     if (categoryMode === 'retail') return noFaktur.includes('GSIR') || noFaktur.includes('GSR') || noFaktur.includes('GTPA') || noFaktur.includes('PTPA') || noFaktur.includes('PSIR');
                     else if (categoryMode === 'grosir') return noFaktur.includes('GSIG') || noFaktur.includes('GRG');
                     return true; 
                }).sort((a, b) => a.profitPercent - b.profitPercent);
          }, [data, priceListData, viewMode, categoryMode]);
          
          const visibleProfitData = useMemo(() => {
              return profitData.filter(item => {
                  if (deletedProfitIds.has(item._id)) return false; 
                  if (item.omset === 0 && item.costPrice !== 0) return false;
                  if (!checkMinPrice(item)) return false;

                  // Logika Filter Lanjutan Profit (Multi Parameter)
                  for (const filter of profitFilters) {
                      let fieldToSearch = '';
                      switch (filter.category) {
                          case 'NO FAKTUR': fieldToSearch = item.noFaktur; break;
                          case 'NAMA PENJUAL': fieldToSearch = item.namaPenjual; break;
                          case 'NAMA PELANGGAN': fieldToSearch = item.namaPelanggan; break;
                          case 'KETERANGAN': fieldToSearch = item.keterangan; break;
                          case 'NAMA BARANG': fieldToSearch = item.namaBarang; break;
                          default: fieldToSearch = '';
                      }

                      const targetStr = String(fieldToSearch || '').toLowerCase();

                      // Filter Mencakup (Include)
                      if (filter.include) {
                          const includeTerms = filter.include.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
                          if (includeTerms.length > 0) {
                              const isIncluded = includeTerms.some(term => targetStr.includes(term));
                              if (!isIncluded) return false; // Gagal di salah satu parameter, langsung hide
                          }
                      }

                      // Filter Tidak Mencakup (Exclude)
                      if (filter.exclude) {
                          const excludeTerms = filter.exclude.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
                          if (excludeTerms.length > 0) {
                              const isExcluded = excludeTerms.some(term => targetStr.includes(term));
                              if (isExcluded) return false; // Termasuk kata yang di-exclude, langsung hide
                          }
                      }
                  }

                  return true;
              });
          }, [profitData, deletedProfitIds, profitFilters, checkMinPrice]); 

          // --- LOGIC: PROMO ANALYSIS ---
          const promoAnalysisData = useMemo(() => {
            if (viewMode !== 'promo' || !data || Object.keys(promoData).length === 0) return [];
            
            const results = [];
            data.forEach(item => {
                const itemName = item.namaBarang ? String(item.namaBarang).trim().toUpperCase() : "";
                if (item.noFaktur.includes('GSR') || item.noFaktur.includes('GRG')) return;

                const isRetail = item.noFaktur.includes('GSIR') || item.noFaktur.includes('GSR') || item.noFaktur.includes('GTPA') || item.noFaktur.includes('PTPA') || item.noFaktur.includes('PSIR');
                const isGrosir = item.noFaktur.includes('GSIG') || item.noFaktur.includes('GRG');
                if (categoryMode === 'retail' && !isRetail) return;
                if (categoryMode === 'grosir' && !isGrosir) return;
                if (!checkMinPrice(item)) return;

                if (promoData[itemName]) {
                    const promoInfo = promoData[itemName];
                    const qty = Math.abs(item.qty || 0);
                    const omset = Math.abs(item.omset || 0);
                    const unitPrice = qty > 0 ? Math.round(omset / qty) : 0;
                    const diff = unitPrice - promoInfo.price;

          const chartDataTrend = useMemo(() => {

            filteredForTrend.forEach(item => {

              const itemName = String(item['Nama Barang'] || '').toUpperCase();
              const noFaktur = item['No. Faktur'] || '';
              const qty = Math.abs(item.Kuantitas || 0);
              const omset = item.Jumlah;
              const unitPrice = qty !== 0 ? Math.abs(omset / qty) : Math.abs(omset);

              if (trendMetric === 'OMSET') {
                  dailyData[date].value += omset;
              } else if (trendMetric === 'BRACKET_TV') {
                  const isBracket = itemName.includes('BRACKET');
                  const isTV = itemName.includes('TV') && !itemName.includes('BRACKET') && !itemName.includes('DAIKIN');
                  if (isBracket) {
                      dailyData[date].bracketValue += qty;
                  }
                  if (isTV) {
                      dailyData[date].tvValue += qty;
                  }
              } else if (trendMetric === 'EXTENDED_1JT') {
                  const isExtended = itemName.includes('EXTENDED');
                  const isDiatasSatuJuta = unitPrice > 1000000;
                  if (isExtended) {
                      dailyData[date].ewValue += qty;
                  }
                  if (isDiatasSatuJuta) {
                      dailyData[date].item1JtValue += qty;
                  }
              } else if (trendMetric === 'NOTA') {
                  const isReturn = noFaktur.includes('GSR') || noFaktur.includes('GRG');
                  const isNotaCountable = noFaktur.includes('GSIR') || noFaktur.includes('GSIG') || noFaktur.includes('PSIR') || noFaktur.includes('GTPA') || noFaktur.includes('PTPA');
                  if (isNotaCountable && !isReturn) {
                      dailyData[date].notaSet.add(noFaktur);
                  } else if (isReturn) {
                      dailyData[date].rSet.add(noFaktur);
                  }
              }
            });
            
            return Object.keys(dailyData).map(date => {
                let finalValue = dailyData[date].value;
                if (trendMetric === 'NOTA') {
                    finalValue = Math.max(0, dailyData[date].notaSet.size - dailyData[date].rSet.size);
                }
                return { 
                    date, 
                    value: finalValue,
                    bracketValue: dailyData[date].bracketValue,
                    tvValue: dailyData[date].tvValue,
                    ewValue: dailyData[date].ewValue,
                    item1JtValue: dailyData[date].item1JtValue
                };
            }).sort((a, b) => a.date.localeCompare(b.date));
          }, [finalFilteredData, trendBrand, trendCategory, trendMetric]);

          const chartDataBrand = useMemo(() => {
            const brands = {};
            finalFilteredData.forEach(item => {
              if (item.BRAND !== 'TIDAK DIKETAHUI') brands[item.BRAND] = (brands[item.BRAND] || 0) + item.Jumlah;
            });
            return Object.keys(brands).map(name => ({ 
              name, value: brands[name],

            })).sort((a, b) => b.value - a.value).slice(0, 20);
          }, [finalFilteredData, totalSalesCurrent]);

          const chartDataCategory = useMemo(() => {

            finalFilteredData.forEach(item => { cats[item.Kategori] = (cats[item.Kategori] || 0) + item.Jumlah; });

            })).sort((a, b) => b.value - a.value);

          const compareOptions = useMemo(() => {

          const filteredCompareOptions = useMemo(() => {
              if (!compareSearchTerm) return compareOptions;

          const chartDataCompare = useMemo(() => {
            if (selectedCompareItems.length === 0) return [];
            const entityField = compareType === 'BRAND' ? 'BRAND' : compareType === 'KATEGORI' ? 'Kategori' : 'Nama Pelanggan';
            const uniqueDates = Array.from(new Set(finalFilteredData.map(d => d.TanggalISO))).sort();
            return uniqueDates.map(date => {

          const timeCompareResult = useMemo(() => {
            if (compareMode !== 'TIME') return null;
            
            let p1Start, p1End, p2Start, p2End;
            let label1 = 'Periode 1', label2 = 'Periode 2';

            if (timeCompareType === 'BULAN') {
                if (!tcMonth1 || !tcMonth2) return null;
                p1Start = `${tcMonth1}-01`;
                p1End = new Date(tcMonth1.split('-')[0], tcMonth1.split('-')[1], 0).toISOString().split('T')[0];

                p2End = new Date(tcMonth2.split('-')[0], tcMonth2.split('-')[1], 0).toISOString().split('T')[0];
                const getMonthName = (yyyymm) => {
                    const [y, m] = yyyymm.split('-');
                    const date = new Date(y, m - 1);
                    return date.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
