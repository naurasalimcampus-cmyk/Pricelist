                label2 = getMonthName(tcMonth2);
            } else {
                if (!tcStart1 || !tcEnd1 || !tcStart2 || !tcEnd2) return null;
                p1Start = tcStart1; p1End = tcEnd1;
                p2Start = tcStart2; p2End = tcEnd2;
                const formatDate = (iso) => new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
                label1 = `${formatDate(tcStart1)} - ${formatDate(tcEnd1)}`;
                label2 = `${formatDate(tcStart2)} - ${formatDate(tcEnd2)}`;
            }

            const dataP1 = analyticDataWithoutDate.filter(d => d.TanggalISO >= p1Start && d.TanggalISO <= p1End);
            const dataP2 = analyticDataWithoutDate.filter(d => d.TanggalISO >= p2Start && d.TanggalISO <= p2End);

            const sumP1 = dataP1.reduce((acc, curr) => acc + curr.Jumlah, 0);
            const sumP2 = dataP2.reduce((acc, curr) => acc + curr.Jumlah, 0);

            const dailyP1 = {};
            const dailyP2 = {};
            
            dataP1.forEach(d => {
                const dayIdx = timeCompareType === 'BULAN' ? parseInt(d.TanggalISO.split('-')[2], 10) : Math.floor((new Date(d.TanggalISO) - new Date(p1Start)) / (1000 * 60 * 60 * 24)) + 1;
                dailyP1[dayIdx] = (dailyP1[dayIdx] || 0) + d.Jumlah;
            });
            
            dataP2.forEach(d => {
                const dayIdx = timeCompareType === 'BULAN' ? parseInt(d.TanggalISO.split('-')[2], 10) : Math.floor((new Date(d.TanggalISO) - new Date(p2Start)) / (1000 * 60 * 60 * 24)) + 1;
                dailyP2[dayIdx] = (dailyP2[dayIdx] || 0) + d.Jumlah;
            });

            const maxDayP2 = Object.keys(dailyP2).length ? Math.max(...Object.keys(dailyP2).map(Number)) : 0;
            let sumP1Comparable = 0;
            let label1Comparable = label1;

            if (maxDayP2 > 0) {
                for (let i = 1; i <= maxDayP2; i++) {
                    sumP1Comparable += (dailyP1[i] || 0);
                }
                const targetMaxDays = timeCompareType === 'BULAN' 
                    ? new Date(tcMonth2.split('-')[0], tcMonth2.split('-')[1], 0).getDate() 
                    : Math.floor((new Date(tcEnd2) - new Date(tcStart2)) / 86400000) + 1;
                    
                if (maxDayP2 < targetMaxDays) {
                    label1Comparable = `${label1} (s.d Hari ke-${maxDayP2})`;
                }
            } else {
                sumP1Comparable = sumP1;
            }

            const growth = sumP1Comparable === 0 ? (sumP2 > 0 ? 100 : 0) : ((sumP2 - sumP1Comparable) / sumP1Comparable) * 100;
            const diff = sumP2 - sumP1Comparable;

            const maxDays = Math.max(
                Object.keys(dailyP1).length ? Math.max(...Object.keys(dailyP1).map(Number)) : 0,
                maxDayP2,
                timeCompareType === 'BULAN' ? 31 : 0
            );

            const chartData = [];
            for (let i = 1; i <= maxDays; i++) {
                chartData.push({
                    day: `Hari ${i}`,
                    [label1]: dailyP1[i] || 0,
                    [label2]: dailyP2[i] || 0,
                });
            }

            return { label1, label2, label1Comparable, sumP1, sumP1Comparable, sumP2, growth, diff, chartData };
          }, [compareMode, timeCompareType, tcMonth1, tcMonth2, tcStart1, tcEnd1, tcStart2, tcEnd2, analyticDataWithoutDate]);

          const analyticSalespersonData = useMemo(() => {
              if (activeAnalyticTab !== 'salesperson') return [];
              
              const summary = {};
              const fakturToKet = {};
              
              allData.forEach(item => {
                  const k = item.keterangan ? item.keterangan.trim().toUpperCase() : "";
                  if (k && k !== "-" && k !== ".") {
                      fakturToKet[item.noFaktur] = k;
                  }
              });
              
              // Helper function to calculate week number based on Saturday as end of week
              const getWeekNumber = (dateISO) => {
                  if (!dateISO) return 4;
                  const parts = dateISO.split('-');
                  if (parts.length !== 3) return 4;
                  
                  const year = parseInt(parts[0], 10);
                  const month = parseInt(parts[1], 10) - 1; // 0-indexed month
                  const day = parseInt(parts[2], 10);
                  
                  const date = new Date(year, month, day);
                  const firstDayOfMonth = new Date(year, month, 1);
                  const firstDayOfWeekDay = firstDayOfMonth.getDay(); // 0 (Sun) to 6 (Sat)
                  
                  // Calculate the date of the first Saturday
                  // If first day is Sat (6), first Saturday is 1st.
                  // If first day is Sun (0), first Saturday is 7th.
                  // Formula: 1 + (6 - firstDayOfWeekDay + 7) % 7
                  const offsetToFirstSaturday = (6 - firstDayOfWeekDay + 7) % 7;
                  const firstSaturdayDate = 1 + offsetToFirstSaturday;
                  
                  if (day <= firstSaturdayDate) return 1;
                  if (day <= firstSaturdayDate + 7) return 2;
                  if (day <= firstSaturdayDate + 14) return 3;
                  if (day <= firstSaturdayDate + 21) return 4;
                  return 5; // Handle week 5 for months that span 5 weekends
              };

              finalFilteredData.forEach(item => {
                  const nama = item['Nama Penjual'] || 'TANPA NAMA';
                  if (!summary[nama]) {
                      summary[nama] = {
                          name: nama,
                          omset: 0,
                          qty: 0,
                          fSet: new Set(),
                          rSet: new Set(),
                          bracketQty: 0,
                          tvQty: 0,
                          ewQty: 0,
                          item1JtQty: 0,
                          item1JtOmset: 0,
                          brandOmset: 0,
                          detectedBrand: null,
                          totalProfit: 0,
                          totalCost: 0,
                          weekly: {
                              1: { omset: 0, fSet: new Set(), rSet: new Set(), bracketQty: 0, ewQty: 0, totalProfit: 0 },
                              2: { omset: 0, fSet: new Set(), rSet: new Set(), bracketQty: 0, ewQty: 0, totalProfit: 0 },
                              3: { omset: 0, fSet: new Set(), rSet: new Set(), bracketQty: 0, ewQty: 0, totalProfit: 0 },
                              4: { omset: 0, fSet: new Set(), rSet: new Set(), bracketQty: 0, ewQty: 0, totalProfit: 0 },
                              5: { omset: 0, fSet: new Set(), rSet: new Set(), bracketQty: 0, ewQty: 0, totalProfit: 0 } // Add week 5
                          }
                      };
                      // Deteksi Brand dari kata kedua nama tenaga penjual
                      const parts = nama.trim().split(/\s+/);
                      if (parts.length > 1) {
                          summary[nama].detectedBrand = parts[1].toUpperCase();
                      }
                  }
                  
                  const noFaktur = item['No. Faktur'] || '';
                  const qty = item.Kuantitas || 0;
                  const omset = item.Jumlah || 0;
                  const isReturn = noFaktur.includes('GSR') || noFaktur.includes('GRG');
                  const multiplier = isReturn ? -1 : 1;
                  
                  let weekNum = getWeekNumber(item.TanggalISO);
                  
                  summary[nama].omset += omset;
                  summary[nama].weekly[weekNum].omset += omset;
                  summary[nama].qty += qty;

                  const itemName = String(item['Nama Barang'] || '').toUpperCase().trim();
                  const priceItem = priceListData[itemName];
                  
                  // Perhitungan Profit
                  if (priceItem) {
                      let costPrice = priceItem.cost;
                      if (itemName.includes('PIPA AC DENPOO') || itemName.includes('PIPA DENPO')) { costPrice = costPrice / 30; }
                      const totalCost = costPrice * Math.abs(qty);
                      const rawProfit = Math.abs(omset) - totalCost;
                      summary[nama].totalProfit += (rawProfit * multiplier);
                      summary[nama].weekly[weekNum].totalProfit += (rawProfit * multiplier);
                      summary[nama].totalCost += totalCost;
                  }
                  
                  const isNotaCountable = noFaktur.includes('GSIR') || noFaktur.includes('GSIG') || noFaktur.includes('PSIR') || noFaktur.includes('GTPA') || noFaktur.includes('PTPA');
                  
                  if (isNotaCountable && !isReturn) {
                       const effectiveKet = fakturToKet[noFaktur];
                       if (effectiveKet) {
                           summary[nama].fSet.add("KET:" + effectiveKet);
                           summary[nama].weekly[weekNum].fSet.add("KET:" + effectiveKet);
                       } else {
                           summary[nama].fSet.add("FAK:" + noFaktur);
                           summary[nama].weekly[weekNum].fSet.add("FAK:" + noFaktur);
                       }
                  } else if (isReturn) {
                       const effectiveKet = fakturToKet[noFaktur];
                       if (effectiveKet) {
                           summary[nama].rSet.add("KET:" + effectiveKet);
                           summary[nama].weekly[weekNum].rSet.add("KET:" + effectiveKet);
                       } else {
                           summary[nama].rSet.add("FAK:" + noFaktur);
                           summary[nama].weekly[weekNum].rSet.add("FAK:" + noFaktur);
                       }
                  }
                  
                  const unitPrice = qty !== 0 ? Math.abs(omset / qty) : Math.abs(omset);
                  
                  // Hitung Qty Bracket
                  if (itemName.includes('BRACKET')) {
                      summary[nama].bracketQty += qty;
                      summary[nama].weekly[weekNum].bracketQty += qty;
                  }
                  // Hitung Qty Extended
                  if (itemName.includes('EXTENDED')) {
                      summary[nama].ewQty += qty;
                      summary[nama].weekly[weekNum].ewQty += qty;
                  }
                  // Hitung Qty TV (Tidak berisi kata Daikin dan Bracket)
                  if (itemName.includes('TV') && !itemName.includes('BRACKET') && !itemName.includes('DAIKIN')) {
                      summary[nama].tvQty += qty;
                  }
                  // Hitung Qty & Omset Barang diatas 1.000.000
                  if (unitPrice > 1000000) {
                      summary[nama].item1JtQty += qty;
                      summary[nama].item1JtOmset += omset;
                  }
                  
                  // Hitung Omset untuk Brand yang sesuai nama tenaga penjual
                  if (summary[nama].detectedBrand && itemName.includes(summary[nama].detectedBrand)) {
                      summary[nama].brandOmset += omset;
                  }
              });
              
              return Object.values(summary).map(s => {
                  const totalNota = Math.max(0, s.fSet.size - s.rSet.size);
                  const atp = totalNota > 0 ? s.omset / totalNota : 0;
                  const aqt = totalNota > 0 ? s.qty / totalNota : 0;
                  const pctBracket = s.tvQty > 0 ? (s.bracketQty / s.tvQty) * 100 : 0;
                  const pctEw = s.item1JtQty > 0 ? (s.ewQty / s.item1JtQty) * 100 : 0;
                  const pctBrand = s.omset > 0 && s.detectedBrand ? (s.brandOmset / s.omset) * 100 : 0;
                  const pctProfit = s.totalCost > 0 ? (s.totalProfit / s.totalCost) * 100 : 0;
                  
                  return {
                      ...s,
                      totalNota,
                      atp,
                      aqt,
                      pctBracket,
                      pctEw,
                      pctBrand,
                      pctProfit
                  };
              }).sort((a, b) => b.omset - a.omset);
          }, [finalFilteredData, activeAnalyticTab, allData, priceListData]);

          const handleSortSalesperson = (key) => {
              let direction = 'desc';
              if (salespersonSort.key === key && salespersonSort.direction === 'desc') {
                  direction = 'asc';
              }
              setSalespersonSort({ key, direction });
          };

          const sortedSalespersonData = useMemo(() => {
              if (!analyticSalespersonData) return [];
              return [...analyticSalespersonData].sort((a, b) => {
                  let aVal = a[salespersonSort.key];
                  let bVal = b[salespersonSort.key];
                  
                  if (typeof aVal === 'string') {
                      aVal = aVal.toLowerCase();
                      bVal = bVal.toLowerCase();
                  }
                  
                  if (aVal < bVal) return salespersonSort.direction === 'asc' ? -1 : 1;
                  if (aVal > bVal) return salespersonSort.direction === 'asc' ? 1 : -1;
                  return 0;
              });
          }, [analyticSalespersonData, salespersonSort]);

          const getSortIcon = (colKey) => {
              if (salespersonSort.key !== colKey) return <ArrowRightLeft className="w-3 h-3 rotate-90 opacity-0 group-hover:opacity-40 transition-opacity" />;
              return salespersonSort.direction === 'asc' ? <ChevronUp className="w-3 h-3 text-blue-600" /> : <ChevronDown className="w-3 h-3 text-blue-600" />;
          };

          const salespersonTotalStats = useMemo(() => {
              if (!analyticSalespersonData || analyticSalespersonData.length === 0) return null;
              let totalNota = 0, totalOmset = 0, totalBracketQty = 0, totalTvQty = 0, totalEwQty = 0, totalItem1JtQty = 0, totalItem1JtOmset = 0, totalQty = 0, totalBrandOmset = 0, totalOmsetForBrandDeal = 0;
              let totalProfit = 0, totalCost = 0;

              analyticSalespersonData.forEach(item => {
                  totalNota += item.totalNota;
                  totalOmset += item.omset;
                  totalBracketQty += item.bracketQty;
                  totalTvQty += item.tvQty;
                  totalEwQty += item.ewQty;
                  totalItem1JtQty += item.item1JtQty;
                  totalItem1JtOmset += item.item1JtOmset;
                  totalQty += item.qty;
                  totalProfit += item.totalProfit || 0;
                  totalCost += item.totalCost || 0;
                  if (item.detectedBrand) {
                      totalBrandOmset += item.brandOmset;
                      totalOmsetForBrandDeal += item.omset;
                  }
              });

              return {
                  totalNota, totalOmset, totalBracketQty, totalTvQty, totalEwQty, totalItem1JtQty, totalItem1JtOmset, totalQty, totalBrandOmset, totalOmsetForBrandDeal, totalProfit, totalCost,
                  atp: totalNota > 0 ? totalOmset / totalNota : 0,
                  aqt: totalNota > 0 ? totalQty / totalNota : 0,
                  pctBracket: totalTvQty > 0 ? (totalBracketQty / totalTvQty) * 100 : 0,
                  pctEw: totalItem1JtQty > 0 ? (totalEwQty / totalItem1JtQty) * 100 : 0,
                  pctBrand: totalOmsetForBrandDeal > 0 ? (totalBrandOmset / totalOmsetForBrandDeal) * 100 : 0,
                  pctProfit: totalCost > 0 ? (totalProfit / totalCost) * 100 : 0
              };
          }, [analyticSalespersonData]);

          const salespersonDetailData = useMemo(() => {
              if (!expandedAnalyticSalesperson) return {
                  data: [], trend: [], brands: [], categories: [], leasingSales: 0, leasingQty: 0
              };
              
              const salesData = finalFilteredData.filter(d => d['Nama Penjual'] === expandedAnalyticSalesperson);
              
              // Tren Harian Berdasarkan Metrik
              const dailyData = {};
              salesData.forEach(item => {
                  const date = item.TanggalISO || 'N/A';
                  if (!dailyData[date]) {
                      dailyData[date] = { date, value: 0, notaSet: new Set(), rSet: new Set(), bracketValue: 0, tvValue: 0, ewValue: 0, item1JtValue: 0 };
                  }
                  
                  const itemName = String(item['Nama Barang'] || '').toUpperCase();
                  const noFaktur = item['No. Faktur'] || '';
                  const qty = Math.abs(item.Kuantitas || 0);
                  const omset = item.Jumlah;
                  const unitPrice = qty !== 0 ? Math.abs(omset / qty) : Math.abs(omset);

                  if (salespersonTrendMetric === 'OMSET') {
                      dailyData[date].value += omset;
                  } else if (salespersonTrendMetric === 'BRACKET_TV') {
                      const isBracket = itemName.includes('BRACKET');
                      const isTV = itemName.includes('TV') && !itemName.includes('BRACKET') && !itemName.includes('DAIKIN');
                      if (isBracket) {
                          dailyData[date].bracketValue += qty;
                      }
                      if (isTV) {
                          dailyData[date].tvValue += qty;
                      }
                  } else if (salespersonTrendMetric === 'EXTENDED_1JT') {
                      const isExtended = itemName.includes('EXTENDED');
                      const isDiatasSatuJuta = unitPrice > 1000000;
                      if (isExtended) {
                          dailyData[date].ewValue += qty;
                      }
                      if (isDiatasSatuJuta) {
                          dailyData[date].item1JtValue += qty;
                      }
                  } else if (salespersonTrendMetric === 'NOTA') {
                      const isReturn = noFaktur.includes('GSR') || noFaktur.includes('GRG');
                      const isNotaCountable = noFaktur.includes('GSIR') || noFaktur.includes('GSIG') || noFaktur.includes('PSIR') || noFaktur.includes('GTPA') || noFaktur.includes('PTPA');
                      if (isNotaCountable && !isReturn) {
                          dailyData[date].notaSet.add(noFaktur);
                      } else if (isReturn) {
                          dailyData[date].rSet.add(noFaktur);
                      }
                  }
              });

                  let finalValue = dailyData[date].value;
                  if (salespersonTrendMetric === 'NOTA') {
                      finalValue = Math.max(0, dailyData[date].notaSet.size - dailyData[date].rSet.size);
                  }
                  return { 
                      date, 
                      value: finalValue,
                      bracketValue: dailyData[date].bracketValue,
                      tvValue: dailyData[date].tvValue,
                      ewValue: dailyData[date].ewValue,
                      item1JtValue: dailyData[date].item1JtValue
                  };
              }).sort((a, b) => a.date.localeCompare(b.date));

              // Kalkulasi Total per Minggu (Akhir minggu = Minggu / Sunday)
              const getWeekEnd = (dateStr) => {
                  if (!dateStr || dateStr === 'N/A') return 0;
                  const parts = dateStr.split('-');
                  if (parts.length !== 3) return 0;
                  const d = new Date(parts[0], parts[1] - 1, parts[2]);
                  const day = d.getDay();
                  d.setDate(d.getDate() + (day === 0 ? 0 : 7 - day));
                  return d.getTime();
              };

              let weekTotalValue = 0;
              let weekTotalBracket = 0;
              let weekTotalTv = 0;
              let weekTotalEw = 0;
              let weekTotal1Jt = 0;

              trend = trend.map((item, index) => {
                  let isSunday = false;
                  if (item.date && item.date !== 'N/A') {
                      const parts = item.date.split('-');
                      if (parts.length === 3) {
                          const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                          isSunday = dateObj.getDay() === 0;
                      }
                  }
                  
                  weekTotalValue += item.value || 0;
                  weekTotalBracket += item.bracketValue || 0;
                  weekTotalTv += item.tvValue || 0;
                  weekTotalEw += item.ewValue || 0;
                  weekTotal1Jt += item.item1JtValue || 0;

                  const nextItem = trend[index + 1];
                  let isLastDayOfWeek = false;
                  
                  if (!nextItem) {
                      isLastDayOfWeek = true;
                  } else {
                      if (getWeekEnd(item.date) !== getWeekEnd(nextItem.date)) {
                          isLastDayOfWeek = true;
                      }
                  }

                  const currentWeeklyTotal = weekTotalValue;
                  const currentWeeklyBracket = weekTotalBracket;
                  const currentWeeklyTv = weekTotalTv;
                  const currentWeeklyEw = weekTotalEw;
                  const currentWeekly1Jt = weekTotal1Jt;

                  if (isLastDayOfWeek) {
                      weekTotalValue = 0; // reset untuk minggu berikutnya
                      weekTotalBracket = 0;
                      weekTotalTv = 0;
                      weekTotalEw = 0;
                      weekTotal1Jt = 0;
                  }

                  return { 
                      ...item, 
                      isSunday, 
                      isLastDayOfWeek, 
                      weeklyTotal: isLastDayOfWeek ? currentWeeklyTotal : 0,
                      weeklyBracket: isLastDayOfWeek ? currentWeeklyBracket : 0,
                      weeklyTv: isLastDayOfWeek ? currentWeeklyTv : 0,
                      weeklyEw: isLastDayOfWeek ? currentWeeklyEw : 0,
                      weekly1Jt: isLastDayOfWeek ? currentWeekly1Jt : 0
                  };
              });

              // Top Brands

              });
              const totalSales = salesData.reduce((sum, item) => sum + item.Jumlah, 0);
              const brandsData = Object.keys(brands).map(name => ({

                      leasingQty += qty; 
                  }
              });

              return {

              };

              if (!hiddenColumns.includes('omset')) headers.push(<th key="as5" className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-right text-amber-600">Total Omset Aging</th>);

          const renderAgingSummaryRows = () => {

                if (!hiddenColumns.includes('qty')) cells.push(<td key="as4" className={`p-4 text-xs text-center font-bold text-slate-700`}>{item.qty} Pcs</td>);
                if (!hiddenColumns.includes('omset')) cells.push(<td key="as5" className={`p-4 text-sm font-bold text-right text-amber-600`}>{formatIDR(item.omset)}</td>);
                
                return <tr key={item.name} className="hover:bg-amber-50/30 transition-colors" onClick={() => { setItemSearchTerm(item.name); setFrontSearchCategory('NAMA PENJUAL'); setShowAgingSummary(false); }}>{cells}</tr>;

          const renderProfitSummaryRows = () => {
            return profitSummaryBySales.map((item, index) => {
                const isDeleted = deletedProfitSummaryNames.has(item.name);
                if (isDeleted) return null; 

                const cells = [];
                let rowClass = "hover:bg-emerald-50/20 transition-colors cursor-pointer";
                if (item.profitPercent < 2) rowClass = "bg-red-100 hover:bg-red-200 cursor-pointer transition-colors";

                if (!hiddenColumns.includes('no')) cells.push(<td key="ps1" className="p-4 text-xs text-slate-400">{index + 1}</td>);
                if (!hiddenColumns.includes('sales')) cells.push(<td key="ps2" className={`p-4 text-sm font-bold text-slate-700`}>{item.name}</td>);
                if (!hiddenColumns.includes('count')) cells.push(<td key="ps3" className={`p-4 text-xs text-center text-slate-600`}>{item.count}</td>);
                if (!hiddenColumns.includes('omset')) cells.push(<td key="ps4" className={`p-4 text-sm font-medium text-right text-slate-600`}>{formatIDR(item.omset)}</td>);
                if (!hiddenColumns.includes('profit')) cells.push(<td key="ps5" className={`p-4 text-sm font-bold text-right ${(item.profit >= 0 ? 'text-emerald-600' : 'text-red-600') + ' bg-emerald-50/30'}`}>{formatIDR(item.profit)}</td>);

                return <tr key={item.name} className={rowClass} onClick={() => setSelectedSales(item.name)}>{cells}</tr>;

          // Data untuk Extended Check (Tambahan pengaman agar variabel terdefinisi)
          const extendedCheckData = useMemo(() => {
              if (viewMode !== 'extended_check' || !data) return [];
              const results = [];
              const groupedByFaktur = {};
              data.forEach(item => {
                  if (!groupedByFaktur[item.noFaktur]) groupedByFaktur[item.noFaktur] = [];
                  groupedByFaktur[item.noFaktur].push(item);
              });

              data.forEach(item => {
                  const nameUpper = String(item.namaBarang || '').toUpperCase();
                  if (nameUpper.includes('EXTENDED')) {
                      // Filter Kategori
                      const noFaktur = item.noFaktur || "";
                      let matchCategory = true;
                      if (categoryMode === 'retail') matchCategory = noFaktur.includes('GSIR') || noFaktur.includes('GSR') || noFaktur.includes('GTPA') || noFaktur.includes('PTPA') || noFaktur.includes('PSIR');
                      else if (categoryMode === 'grosir') matchCategory = noFaktur.includes('GSIG') || noFaktur.includes('GRG');
                      if (!matchCategory) return;

                      // Cari barang utama di faktur yang sama
                      const invoiceItems = groupedByFaktur[noFaktur] || [];
                      const mainItems = invoiceItems.filter(i => !String(i.namaBarang || '').toUpperCase().includes('EXTENDED') && !isDiscountRow(i));
                      const tipeBarang = mainItems.map(i => i.namaBarang).join(', ') || item.namaBarang;

                      // Ekstrak No HP
                      let noHp = "-";
                      const ket = item.keterangan || "";
                      const hpMatch = ket.match(/(?:^|\D)((?:\d(?:[\s-]*\d){8,14}))(?:\D|$)/);
                      if (hpMatch && hpMatch[1]) {
                          noHp = hpMatch[1].replace(/[\s-]/g, '');
                      }

                      results.push({
                          ...item,
                          extPelanggan: item.namaPelanggan,
                          extNoHp: noHp,
                          extTipeBarang: tipeBarang
                      });
                  }
              });
              return results;

                                      <span className="text-slate-300 font-bold mx-1">-</span>

                                                  {index === 0 && <label className="text-[10px] font-bold text-slate-500 uppercase">Insentif / Pcs</label>}
                                                  <input type="number" value={rule.reward} onChange={(e) => updateIncentiveRule(rule.id, 'reward', e.target.value)} placeholder="Cth: 15000" className="w-full px-2 py-1.5 border border-slate-200 rounded text-xs focus:outline-none focus:border-purple-500 bg-slate-50" />

                {showFileManager && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
                        <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 relative flex flex-col max-h-[85vh] animate-in zoom-in-95 duration-200">
                            <div className="flex justify-between items-center mb-6 shrink-0">
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <FileSpreadsheet className="w-6 h-6 text-blue-600 bg-blue-50 p-1 rounded-lg" />
                                    Kelola File Data
                                </h3>
                                <button onClick={() => { setShowFileManager(false); setPendingAppendFile(null); }} className="text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 p-1.5 rounded-full transition-colors">
                                    <X className="w-5 h-5" />
                                </button>
                            </div>

                            {/* List of current files */}
                            <div className="mb-6 overflow-y-auto pr-2 custom-scrollbar flex-1">
                                <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-3">File Terunggah ({uploadedFiles.length})</p>
                                <div className="space-y-2.5">
                                    {uploadedFiles.map((file, idx) => (
                                        <div key={idx} className="flex justify-between items-center bg-slate-50 border border-slate-100 p-3 rounded-xl shadow-sm">
                                            <div className="flex flex-col">
                                                <span className="text-sm font-bold text-slate-700 truncate max-w-[240px]" title={file.name}>{file.name}</span>
                                                <span className="text-[11px] font-medium text-slate-500 mt-0.5">{file.rows.toLocaleString('id-ID')} Transaksi</span>
                                            </div>
                                            <CheckCircle className="w-5 h-5 text-emerald-500 shrink-0" />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Add new file section */}
                            <div className="mt-auto pt-4 shrink-0">
                                {!pendingAppendFile ? (
                                    <>
                                        <input type="file" accept=".xlsx, .xls" ref={appendFileInputRef} onChange={(e) => { 
                                            const file = e.target.files[0];
                                            if (file) setPendingAppendFile(file);
                                            e.target.value = null; 
                                        }} className="hidden" />
                                        <button 
                                            onClick={() => appendFileInputRef.current?.click()} 
                                            className="w-full py-3.5 bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold rounded-xl transition-all border border-blue-200 hover:border-blue-300 flex items-center justify-center gap-2 shadow-sm text-sm"
                                        >
                                            <Plus className="w-5 h-5" /> Pilih File Excel Tambahan
                                        </button>
                                    </>
                                ) : (
                                    <div className="bg-blue-50 p-5 rounded-2xl border border-blue-200 text-center animate-in slide-in-from-bottom-2">
                                        <div className="mx-auto w-12 h-12 bg-white rounded-full flex items-center justify-center mb-3 shadow-sm text-blue-500">
                                            <FileSpreadsheet className="w-6 h-6" />
                                        </div>
                                        <p className="text-sm font-bold text-slate-800 mb-1 truncate max-w-[300px] mx-auto" title={pendingAppendFile.name}>{pendingAppendFile.name}</p>
                                        <p className="text-xs font-medium text-slate-500 mb-5">Apakah Anda yakin ingin menggabungkan data dari file ini?</p>
                                        <div className="flex gap-2">
                                            <button onClick={() => setPendingAppendFile(null)} className="flex-1 py-2.5 bg-white text-slate-600 font-bold rounded-xl border border-slate-200 hover:bg-slate-100 transition-colors text-xs">Batal</button>
                                            <button onClick={() => {
                                                processExcelFile(pendingAppendFile, true);
                                                setPendingAppendFile(null);
                                                setShowFileManager(false);
                                            }} className="flex-1 py-2.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-md transition-colors text-xs">Gabungkan Data</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                )}

                {/* TOAST NOTIFICATION COPY SUCCESS */}
                <div className={`fixed bottom-6 right-6 z-[100] transition-all duration-300 transform ${copySuccess ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none'}`}>
                  <div className="bg-slate-800 text-white px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-4 border border-slate-700">
                    <div className="bg-green-500 rounded-full p-1.5 shadow-sm">
                        <Check className="w-5 h-5 text-white" />
                    </div>
                    <div>
                        <p className="text-sm font-bold tracking-wide">Tersalin!</p>
                        <p className="text-xs text-slate-300">Data berhasil disalin ke clipboard.</p>
                    </div>
                  </div>
                </div>

                {/* TOAST NOTIFICATION APPEND SUCCESS */}
                <div className={`fixed bottom-6 left-6 z-[100] transition-all duration-300 transform ${appendSuccessData.show ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none'}`}>
                  <div className="bg-emerald-800 text-white px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-4 border border-emerald-700">
                    <div className="bg-emerald-500 rounded-full p-1.5 shadow-sm">
                        <Check className="w-5 h-5 text-white" />
                    </div>
                    <div>
                        <p className="text-sm font-bold tracking-wide">{appendSuccessData.message}</p>
                        <p className="text-xs text-emerald-100">{appendSuccessData.detail}</p>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
