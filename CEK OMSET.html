    <!-- Suppress Babel 500KB deoptimisation warning -->
    <script>
        const originalWarn = console.warn;
        const originalError = console.error;
        const filterBabelMsg = (args) => typeof args[0] === 'string' && args[0].includes('500KB');
        console.warn = function(...args) { if (!filterBabelMsg(args)) originalWarn.apply(console, args); };
        console.error = function(...args) { if (!filterBabelMsg(args)) originalError.apply(console, args); };
    </script>

    <!-- Babel Standalone to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        const INITIAL_MAPPING = [

        const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#2563eb', '#059669', '#d97706'];

        const parseIndoDate = (val) => {
          if (!val) return null;
          if (typeof val === 'number') {
            const date = new Date(Math.round((val - 25569) * 86400 * 1000));
            const userOffset = date.getTimezoneOffset() * 60000;
            const finalDate = new Date(date.getTime() + userOffset);
            finalDate.setHours(12, 0, 0, 0);
            return finalDate;
          }
          let strVal = val.toString().trim();
          const cleanStr = strVal.toLowerCase();
          const idMonths = ["januari", "februari", "maret", "april", "mei", "juni", "juli", "agustus", "september", "oktober", "november", "desember"];
          const idShort = ["jan", "feb", "mar", "apr", "mei", "jun", "jul", "agu", "sep", "okt", "nov", "des"];

          const ddmmyyyy = cleanStr.match(/^(\d{1,2})[/\-](\d{1,2})[/\-](\d{4})$/);
          if (ddmmyyyy) {
            const d = new Date(ddmmyyyy[3], ddmmyyyy[2] - 1, ddmmyyyy[1]);
            d.setHours(12, 0, 0, 0);
            return d;
          }
          const parts = cleanStr.split(/[\s\-/,]+/);
          if (parts.length >= 3) {
            let day = parseInt(parts[0]);
            let year = parseInt(parts[2]);
            if (year < 100) year += 2000; 
            let month = -1;
            month = idMonths.indexOf(parts[1]);
            if (month === -1) month = idShort.indexOf(parts[1]);
            if (day > 0 && month !== -1 && year > 1900) {
              const d = new Date(year, month, day);
              d.setHours(12, 0, 0, 0);
              return d;
            }
          }
          const fallback = new Date(strVal);
          if (!isNaN(fallback.getTime())) {
            fallback.setHours(12, 0, 0, 0);
            return fallback;
          }
          return null;
        };

        const formatDateToISO = (date) => {
          if (!date || isNaN(date.getTime())) return '';
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        };

        // Helper Fungsi Diskon Match
        const calculateMatchScore = (itemStr, discountStr) => {
          if (!itemStr || !discountStr) return 0;
          const s1 = String(itemStr).toLowerCase();
          const s2 = String(discountStr).toLowerCase();
          const words1 = s1.split(/[\s\W]+/);
          const words2 = new Set(s2.split(/[\s\W]+/));

          if (words1.includes("toshiba")) {
             const isTV = words1.includes("tv") || s1.includes("tv "); 
             if (!isTV) {
               if (words2.has("toshiba")) return 0; 
               if (words2.has("midea")) return 100;
             } else {
               if (words2.has("toshiba")) return 100;
             }
          }

          let count = 0;
          words2.forEach(w => {
            if (w.length > 1 && words1.includes(w)) count++;
          });
          return count;
        };

        const hasCommonWord = (itemStr, discountStr) => calculateMatchScore(itemStr, discountStr) > 0;

        const isDiscountRow = (row) => {
          const keywords = ['potongan', 'diskon', 'disc', 'discount'];
          const namaBarang = String(row.namaBarang || "").toLowerCase();
          const keterangan = String(row.keterangan || "").toLowerCase();
          return keywords.some(key => namaBarang.includes(key) || keterangan.includes(key));
        };

        const isValidItem = (row) => {
          if (!row) return false;
          if (isDiscountRow(row)) return false;
          const qty = Math.abs(row.qty || 0);
          const amount = Math.abs(row.omset || 0);
          return qty !== 0 && amount !== 0;
        };

        const getMatchIcon = (type) => {
          if (type.includes("Atas (Cocok)")) return <ArrowUpCircle size={14} className="text-green-600" />;
          if (type.includes("Atas")) return <ArrowUpCircle size={14} className="text-blue-500" />;
          if (type.includes("Bawah")) return <ArrowDownCircle size={14} className="text-orange-500" />;
          if (type.includes("Nama") || type.includes("Kata")) return <RefreshCw size={14} className="text-purple-500" />;
          if (type.includes("Multi")) return <Layers size={14} className="text-blue-600" />;
          return <AlertTriangle size={14} className="text-gray-400" />;
        };

        const getRowClass = (row, isMatch) => {
          let classes = "border-b border-slate-100 transition-colors ";
          if (row.isMultiDiscount) classes += "bg-blue-50 hover:bg-blue-100 ";
          else if (row.isLinked) classes += "bg-emerald-50 hover:bg-emerald-100 ";
          else classes += "bg-white hover:bg-slate-50 ";

          if (!isMatch && !row.isMultiDiscount) classes += "text-red-600 ";
          else classes += "text-slate-800 ";

          if (row.isMultiDiscount) classes += "border-l-4 border-l-blue-500 ";
          else if (row.isLinked) {
            if (row.linkType === 'parent') classes += "border-l-4 border-l-emerald-600 ";
            if (row.linkType === 'child') classes += "border-l-4 border-l-emerald-300 ml-4 ";
          }
          return classes;
        };

        const ColumnToggler = ({ columns, hiddenColumns, onToggle }) => {
          const [isOpen, setIsOpen] = useState(false);
          const wrapperRef = useRef(null);

          useEffect(() => {
            function handleClickOutside(event) {
              if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                setIsOpen(false);
              }
            }
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
          }, []);

          return (
            <div className="relative inline-block text-left" ref={wrapperRef}>
              <button
                onClick={() => setIsOpen(!isOpen)}
                className="flex items-center gap-2 px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
              >
                <Eye className="w-4 h-4" />
                Kolom
                <ChevronDown className="w-4 h-4 ml-1" />
              </button>

              {isOpen && (
                <div className="origin-top-right absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none z-50 max-h-64 overflow-y-auto">
                  <div className="py-1">
                    <div className="px-4 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-100">
                      Tampilkan Kolom
                    </div>
                    {columns.map((col) => (
                      col.key !== 'action' && (
                      <label key={col.key} className="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer">
                        <input
                          type="checkbox"
                          className="mr-3 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                          checked={!hiddenColumns.includes(col.key)}
                          onChange={() => onToggle(col.key)}
                        />
                        {col.label}
                      </label>
                      )
                    ))}
                  </div>
                </div>
              )}
            </div>
          );
        };

        function App() {
          const [allData, setAllData] = useState([]);
          const [allRawMappedData, setAllRawMappedData] = useState([]); 
          const [priceListData, setPriceListData] = useState({}); 
          const [promoData, setPromoData] = useState({}); 
          const [agingData, setAgingData] = useState({}); // Tambahan state Aging
          const [promoWeeklyData, setPromoWeeklyData] = useState({}); // Tambahan state Promo Weekly
          const [uploadedFiles, setUploadedFiles] = useState([]);
          const [priceListFileName, setPriceListFileName] = useState("");
          const [promoFileName, setPromoFileName] = useState("");
          const [agingFileName, setAgingFileName] = useState(""); // Tambahan state file Aging
          const [showPasteAging, setShowPasteAging] = useState(false); // State untuk modal paste aging
          const [pastedAgingText, setPastedAgingText] = useState(""); // State teks paste aging
          const [error, setError] = useState("");
          const [isLoading, setIsLoading] = useState(false);
          const [isLibLoaded, setIsLibLoaded] = useState(false);
          
          // State Tampilan
          const [viewMode, setViewMode] = useState('nota'); 
          const [categoryMode, setCategoryMode] = useState('retail'); 
          const [copySuccess, setCopySuccess] = useState(false);
          const [showMissingPromoDescOnly, setShowMissingPromoDescOnly] = useState(false); 
          const [showPromoDashboard, setShowPromoDashboard] = useState(false); 
          const [selectedPromoCategory, setSelectedPromoCategory] = useState(null); 
          const [expandedPromoItem, setExpandedPromoItem] = useState(null); 
          const [promoModalTab, setPromoModalTab] = useState('barang'); 
          const [expandedPromoSales, setExpandedPromoSales] = useState(null);
          const [expandedAnalyticSalesperson, setExpandedAnalyticSalesperson] = useState(null);
          const [showAgingSummary, setShowAgingSummary] = useState(false); // Tambahan state tampilan summary Aging
          const [cashbackType, setCashbackType] = useState('reguler'); // 'reguler' atau 'weekly'
          
          // State Filter Global & Kolom
          const [startDate, setStartDate] = useState('');
          const [endDate, setEndDate] = useState('');
          const [minPriceFilter, setMinPriceFilter] = useState(''); // Tambahan state filter harga
          const [maxPriceFilter, setMaxPriceFilter] = useState(''); // Tambahan state filter harga maksimal
          const [itemSearchTerm, setItemSearchTerm] = useState("");
          const [itemExcludeSearchTerm, setItemExcludeSearchTerm] = useState(""); // Tambahan state filter exclude global
          const [frontSearchCategory, setFrontSearchCategory] = useState('NAMA BARANG'); 
          const [showFrontSuggestions, setShowFrontSuggestions] = useState(false);
          const frontSearchRef = useRef(null);
          const [discountSearch, setDiscountSearch] = useState(""); 
          const [incentiveMode, setIncentiveMode] = useState(false);
          const [showResetConfirm, setShowResetConfirm] = useState(false);
          const [pendingAppendFile, setPendingAppendFile] = useState(null);
          const [showFileManager, setShowFileManager] = useState(false);
          const [appendSuccessData, setAppendSuccessData] = useState({ show: false, message: '', detail: '' });
          const [isActionMenuOpen, setIsActionMenuOpen] = useState(false);
          const actionMenuRef = useRef(null);

          // --- MEMOIZED FILTERED DATA BY DATE ---
          const data = useMemo(() => {
              if (!startDate && !endDate) return allData;
              return allData.filter(item => {
                  if (!item.tanggalISO) return true; // Tetap sertakan jika tanggal kosong agar tidak hilang
                  let match = true;
                  if (startDate && item.tanggalISO < startDate) match = false;
                  if (endDate && item.tanggalISO > endDate) match = false;
                  return match;
              });
          }, [allData, startDate, endDate]);

          const rawMappedData = useMemo(() => {
              if (!startDate && !endDate) return allRawMappedData;
              return allRawMappedData.filter(item => {
                  if (!item.tanggalISO) return true;
                  let match = true;
                  if (startDate && item.tanggalISO < startDate) match = false;
                  if (endDate && item.tanggalISO > endDate) match = false;
                  return match;
              });
          }, [allRawMappedData, startDate, endDate]);

          // Helper untuk mengecek filter harga minimum dan maksimum
          const checkMinPrice = useCallback((item) => {
              if (!minPriceFilter && !maxPriceFilter) return true;
              const min = parseFloat(minPriceFilter) || 0;
              const max = parseFloat(maxPriceFilter) || Infinity;
              const qty = Math.abs(item.qty || 0);
              const omset = Math.abs(item.omset || 0);
              const unitPrice = qty > 0 ? (omset / qty) : omset;
              
              let isValid = true;
              if (minPriceFilter && unitPrice < min) isValid = false;
              if (maxPriceFilter && unitPrice > max) isValid = false;
              return isValid;
          }, [minPriceFilter, maxPriceFilter]);
          
          // State Input Manual Insentif Dinamis
          const [incentiveRules, setIncentiveRules] = useState([{ id: Date.now(), name: "", price: "", reward: "" }]);

          // State Analytics
          const [activeAnalyticTab, setActiveAnalyticTab] = useState('dashboard');
          const [selectedSaleType, setSelectedSaleType] = useState('SEMUA');
          const [retailSubFilter, setRetailSubFilter] = useState('SEMUA');
          const [analyticSearchCategory, setAnalyticSearchCategory] = useState('NAMA BARANG');
          const [analyticSearchTerm, setAnalyticSearchTerm] = useState('');
          const [analyticExcludeSearchTerm, setAnalyticExcludeSearchTerm] = useState(''); // Tambahan state filter exclude analytic
          const [showAnalyticSuggestions, setShowAnalyticSuggestions] = useState(false);
          const analyticSearchRef = useRef(null);
          const appendFileInputRef = useRef(null);
          const [compareType, setCompareType] = useState('BRAND');
          const [selectedCompareItems, setSelectedCompareItems] = useState([]);
          const [compareSearchTerm, setCompareSearchTerm] = useState('');
          const [modalBrand, setModalBrand] = useState(null);
          const [modalCategory, setModalCategory] = useState(null);
          const [modalItemDetails, setModalItemDetails] = useState(null);
          const [subTotalModalType, setSubTotalModalType] = useState(null); 
          const [trendBrand, setTrendBrand] = useState('SEMUA');
          const [trendCategory, setTrendCategory] = useState('SEMUA');
          const [trendMetric, setTrendMetric] = useState('OMSET'); // State baru untuk filter metrik
          const [salespersonTrendMetric, setSalespersonTrendMetric] = useState('OMSET'); // State filter metrik untuk modal sales
          const [salespersonSort, setSalespersonSort] = useState({ key: 'omset', direction: 'desc' });
          const [salespersonViewType, setSalespersonViewType] = useState('TOTAL'); // Tambahan state mode rekap (TOTAL/WEEKLY)
          const [salespersonWeeklyMetric, setSalespersonWeeklyMetric] = useState('OMSET'); // Tambahan state metrik mingguan

          // State Filter Spesifik Analisa Profit
          const [profitFilters, setProfitFilters] = useState([{ id: Date.now(), category: 'NAMA BARANG', include: '', exclude: '' }]);
          
          const addProfitFilter = () => setProfitFilters([...profitFilters, { id: Date.now(), category: 'NAMA BARANG', include: '', exclude: '' }]);
          const removeProfitFilter = (id) => setProfitFilters(profitFilters.filter(f => f.id !== id));

          // State Komparasi Waktu
          const [compareMode, setCompareMode] = useState('ENTITY'); 
          const [timeCompareType, setTimeCompareType] = useState('BULAN');

          const [tcMonth2, setTcMonth2] = useState('');

          const [tcEnd1, setTcEnd1] = useState('');
          const [tcStart2, setTcStart2] = useState('');
          const [tcEnd2, setTcEnd2] = useState('');

          // State Detail & Modal

          const [showAllPhoneDetails, setShowAllPhoneDetails] = useState(false); 
          const [showProfitSummary, setShowProfitSummary] = useState(false);
          const [selectedTransaction, setSelectedTransaction] = useState(null);

          // Load Library XLSX (xlsx-js-style for styling support)
          useEffect(() => {
            // 1. Cek apakah library sudah dimuat sebelumnya
            if (window.XLSX) {
              setIsLibLoaded(true);
              return;
            }

            // 2. Cek apakah script sedang dalam proses dimuat oleh render sebelumnya
            const scriptUrl = "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js";
            let script = document.querySelector(`script[src="${scriptUrl}"]`);

            if (script) {
              // Jika script sudah ada tapi belum selesai load, tambahkan event listener
              script.addEventListener('load', () => setIsLibLoaded(true));
              script.addEventListener('error', () => setError("Gagal memuat pustaka Excel. Periksa koneksi internet Anda."));
              return;
            }

            // 3. Jika belum ada sama sekali, buat elemen script baru
            script = document.createElement('script');
            script.src = scriptUrl;
            script.async = true;
            script.onload = () => setIsLibLoaded(true);
            script.onerror = () => setError("Gagal memuat pustaka Excel. Periksa koneksi internet Anda.");
            document.body.appendChild(script);

            // KUNCI PERBAIKAN: JANGAN hapus script di cleanup function
            // Hal ini untuk mencegah React Strict Mode membatalkan unduhan script saat proses re-render awal.
          }, []);

          useEffect(() => {
            if (viewMode !== 'analytic') {
                setActiveAnalyticTab('dashboard');
            }
          }, [viewMode]);

          useEffect(() => {
            function handleClickOutside(event) {
                if (analyticSearchRef.current && !analyticSearchRef.current.contains(event.target)) {

                }
                if (frontSearchRef.current && !frontSearchRef.current.contains(event.target)) {
                    setShowFrontSuggestions(false);
                }
                if (actionMenuRef.current && !actionMenuRef.current.contains(event.target)) {
                    setIsActionMenuOpen(false);
                }
            }
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
          }, []);

          const togglePhoneGroup = (salesName) => setExpandedPhoneGroups(prev => ({ ...prev, [salesName]: !prev[salesName] }));
          const toggleColumn = (key) => setHiddenColumns(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]);
          
          const handleDeleteRow = (e, id) => { e.stopPropagation(); e.preventDefault(); const newSet = new Set(deletedProfitIds); newSet.add(id); setDeletedProfitIds(newSet); };
